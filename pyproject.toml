[project]
name = "ledgerflow"
version = "0.0.1"
description = "Real-time financial event platform: double-entry ledger, idempotent APIs, transactional outbox."
requires-python = ">=3.11"
dependencies = []   # the domain core has none, and that is the point

[project.optional-dependencies]
# Nothing here is imported by src/ledgerflow/domain, and that is the point:
# the accounting rules must stay testable without a database or a broker.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    # the webhook dispatcher posts to customer endpoints
    "httpx>=0.27",
]
stream = ["confluent-kafka>=2.6"]
analytics = ["pyspark>=3.5", "delta-spark>=3.2", "pyarrow>=18.0"]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    # the dashboard is checked by rendering it, not by reading the CSS
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly so CI and a laptop agree. Without a select, the effective
# rule set is whatever the installed ruff decides today, which is not a thing
# to gate a build on.
[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff's own
    "DTZ",      # naive datetimes -- a real bug class in a ledger, where every
                # timestamp is either business time or system time and a
                # tz-naive one silently becomes whichever the server prefers
]
ignore = [
    # function-call-in-default-argument: this is how FastAPI spells dependency
    # injection (`ctx: TenantContext = Depends(context)`). 26 hits, all of them
    # the framework's intended usage.
    "B008",
    # str+Enum -> StrEnum is not a refactor, it is a behavior change: StrEnum's
    # __str__ returns "debit" where str+Enum returns "Direction.DEBIT". Every
    # f-string holding a Direction or AccountType would start producing a
    # different string, which in a ledger means log lines and error messages
    # silently changing shape. Not worth it for a style rule.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are imported for their side effect of existing.
"tests/conftest.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ledgerflow"]
