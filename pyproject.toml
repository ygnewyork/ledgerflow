[project]
name = "ledgerflow"
version = "0.0.1"
description = "Real-time financial event platform: double-entry ledger, idempotent APIs, transactional outbox."
requires-python = ">=3.11"
dependencies = []   # the domain core has none, and that is the point

[project.optional-dependencies]
# Nothing here is imported by src/ledgerflow/domain, and that is the point:
# the accounting rules must stay testable without a database or a broker.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
]
stream = ["confluent-kafka>=2.6"]
analytics = ["pyspark>=3.5", "delta-spark>=3.2", "pyarrow>=18.0"]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    # the dashboard is checked by rendering it, not by reading the CSS
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ledgerflow"]
